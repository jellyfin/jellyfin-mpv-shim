name: build

on:
  push:
    branches:
      - master
      - main
      - working
jobs:
  build-win64:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Setup git SDK
      uses: Shadowghost/setup-git-for-windows-sdk@node-24
      with:
        flavor: minimal
    - name: Download mpv
      id: mpv
      uses: robinraju/release-downloader@v1
      with:
        repository: 'shinchiro/mpv-winbuild-cmake'
        latest: true
        fileName: 'mpv-dev-x86_64-v3*.7z'
    - name: Install dependencies
      run: |
        7z x "${{ fromJson(steps.mpv.outputs.downloaded_files)[0] }}"
        mv libmpv-2.dll mpv-2.dll
        pip install wheel
        pip install .[all] pywin32
        winget install --id JRSoftware.InnoSetup -e -s winget || true || true
        ./gen_pkg.sh --skip-build
      shell: bash
    - name: PyInstaller Bootloader
      run: |
        ./gen_pkg.sh --get-pyinstaller; cd pyinstaller/bootloader; python ./waf distclean all; cd ..; pip install .
      shell: bash
    - name: Main Build
      run: |
        .\build-win.bat
      shell: cmd
    - name: Artifact Rename
      run: |
        ./artifacts.sh standard
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows
        path: ${{ github.workspace }}/publish/Installer/*.exe
  build-win64-legacy:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Setup git SDK
      uses: Shadowghost/setup-git-for-windows-sdk@node-24
      with:
        flavor: minimal
    - name: Download mpv
      id: mpv
      uses: robinraju/release-downloader@v1
      with:
        repository: 'shinchiro/mpv-winbuild-cmake'
        latest: true
        fileName: 'mpv-dev-x86_64-[0-9]*-git-*.7z'
    - name: Install dependencies
      run: |
        7z x "${{ fromJson(steps.mpv.outputs.downloaded_files)[0] }}"
        mv libmpv-2.dll mpv-2.dll
        pip install wheel
        pip install .[all] pywin32
        winget install --id JRSoftware.InnoSetup -e -s winget || true
        ./gen_pkg.sh --skip-build
      shell: bash
    - name: PyInstaller Bootloader
      run: |
        ./gen_pkg.sh --get-pyinstaller; cd pyinstaller/bootloader; python ./waf distclean all; cd ..; pip install .
      shell: bash
    - name: Main Build
      run: |
        .\build-win.bat
      shell: cmd
    - name: Artifact Rename
      run: |
        ./artifacts.sh legacy64
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-legacy64
        path: ${{ github.workspace }}/publish/Installer/*.exe
  build-win32-legacy:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Setup git SDK
      uses: Shadowghost/setup-git-for-windows-sdk@node-24
      with:
        flavor: minimal
    - name: Download mpv
      id: mpv
      uses: robinraju/release-downloader@v1
      with:
        repository: 'shinchiro/mpv-winbuild-cmake'
        latest: true
        fileName: 'mpv-dev-i686*.7z'
    - name: Install dependencies
      run: |
        7z x "${{ fromJson(steps.mpv.outputs.downloaded_files)[0] }}"
        mv libmpv-2.dll mpv-2.dll
        pip install wheel
        pip install .[all] pywin32
        winget install --id JRSoftware.InnoSetup -e -s winget || true
        ./gen_pkg.sh --skip-build
      shell: bash
    - name: PyInstaller Bootloader
      run: |
        ./gen_pkg.sh --get-pyinstaller; cd pyinstaller/bootloader; python ./waf distclean all; cd ..; pip install .
      shell: bash
    - name: Legacy Build
      run: |
        .\build-win-32.bat
      shell: cmd
    - name: Artifact Rename
      run: |
        ./artifacts.sh legacy
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-legacy32
        path: ${{ github.workspace }}/publish/InstallerLegacy/*.exe
  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Install Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder gettext
        # flatpak-builder needs unprivileged user namespaces, which Ubuntu
        # restricts through AppArmor. The runner images normally relax this
        # already, so don't fail the build if the knob isn't there.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
    - name: Fetch shared modules
      run: |
        git clone --depth=1 https://github.com/flathub/shared-modules.git flatpak/shared-modules
    - name: Cache flatpak-builder state
      uses: actions/cache@v6
      with:
        # mpv and its dependencies are built from source and dominate the run.
        # The key only moves when the manifest does, so the mpv build is
        # restored until it actually changes.
        path: ${{ github.workspace }}/.flatpak-builder
        key: flatpak-${{ matrix.arch }}-${{ hashFiles('flatpak/*.json') }}
        restore-keys: flatpak-${{ matrix.arch }}-
    - name: Install dependencies
      run: |
        ./gen_pkg.sh --skip-build
    - name: Main Build
      run: |
        flatpak-builder build flatpak/com.github.iwalton3.jellyfin-mpv-shim.json \
          --force-clean --repo=repo --user --install-deps-from=flathub
    - name: Artifact Rename
      run: |
        ./artifacts.sh flatpak ${{ matrix.arch }}
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: flatpak-${{ matrix.arch }}
        path: ${{ github.workspace }}/publish/Flatpak/*.flatpak
