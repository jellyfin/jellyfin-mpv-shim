name: build

on:
  push:
    branches:
      - master
      - main
      - working
jobs:
  build-win64:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Setup git SDK
      uses: Shadowghost/setup-git-for-windows-sdk@node-24
      with:
        flavor: minimal
    - name: Download mpv
      id: mpv
      uses: robinraju/release-downloader@v1
      with:
        repository: 'shinchiro/mpv-winbuild-cmake'
        latest: true
        fileName: 'mpv-dev-x86_64-v3*.7z'
    - name: Install dependencies
      run: |
        7z x "${{ fromJson(steps.mpv.outputs.downloaded_files)[0] }}"
        mv libmpv-2.dll mpv-2.dll
        pip install wheel
        pip install .[all] pywin32
        winget install --id JRSoftware.InnoSetup -e -s winget || true || true
        ./gen_pkg.sh --skip-build
      shell: bash
    - name: Check what libmpv needs
      # The pin on the download above exists because of a dependency this
      # step reads. It runs on every build rather than only when raising the
      # pin, because nothing else in the pipeline ever loads this file: an
      # mpv-2.dll that Windows will refuse is not a build error, it is a
      # client that dies at startup on the user's machine.
      run: |
        python tools/check_win_libmpv_deps.py mpv-2.dll
      shell: bash
    - name: PyInstaller Bootloader
      run: |
        ./gen_pkg.sh --get-pyinstaller; cd pyinstaller/bootloader; python ./waf distclean all; cd ..; pip install .
      shell: bash
    - name: Main Build
      run: |
        .\build-win.bat
      shell: cmd
    - name: Artifact Rename
      run: |
        ./artifacts.sh standard
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows
        path: ${{ github.workspace }}/publish/Installer/*.exe
  build-win64-legacy:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Setup git SDK
      uses: Shadowghost/setup-git-for-windows-sdk@node-24
      with:
        flavor: minimal
    - name: Download mpv
      id: mpv
      uses: robinraju/release-downloader@v1
      with:
        repository: 'shinchiro/mpv-winbuild-cmake'
        latest: true
        fileName: 'mpv-dev-x86_64-[0-9]*-git-*.7z'
    - name: Install dependencies
      run: |
        7z x "${{ fromJson(steps.mpv.outputs.downloaded_files)[0] }}"
        mv libmpv-2.dll mpv-2.dll
        pip install wheel
        pip install .[all] pywin32
        winget install --id JRSoftware.InnoSetup -e -s winget || true
        ./gen_pkg.sh --skip-build
      shell: bash
    - name: Check what libmpv needs
      # The pin on the download above exists because of a dependency this
      # step reads. It runs on every build rather than only when raising the
      # pin, because nothing else in the pipeline ever loads this file: an
      # mpv-2.dll that Windows will refuse is not a build error, it is a
      # client that dies at startup on the user's machine.
      run: |
        python tools/check_win_libmpv_deps.py mpv-2.dll
      shell: bash
    - name: PyInstaller Bootloader
      run: |
        ./gen_pkg.sh --get-pyinstaller; cd pyinstaller/bootloader; python ./waf distclean all; cd ..; pip install .
      shell: bash
    - name: Main Build
      run: |
        .\build-win.bat
      shell: cmd
    - name: Artifact Rename
      run: |
        ./artifacts.sh legacy64
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-legacy64
        path: ${{ github.workspace }}/publish/Installer/*.exe
  build-win-arm64:
    # Native ARM64. Deliberately shaped differently from the x86 jobs above,
    # because this image is not the same machine wearing a different CPU:
    #  - No "Setup git SDK" step. That action's aarch64 support resolves to
    #    artifacts git-sdk-arm64 does not publish, and its own docs say
    #    aarch64 needs the "full" flavor, which is not published either. The
    #    x86_64 SDK would run under emulation, but MSYS2's fork() emulation
    #    is exactly the part that is unreliable there.
    #  - So no msgfmt and no unzip. gen_pkg.sh falls back to tools/msgfmt.py
    #    and to python -m zipfile; tests/test_msgfmt.py is what keeps the
    #    former honest against GNU msgfmt.
    #  - No winget step. Inno Setup is preinstalled on this image.
    runs-on: windows-11-arm
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
        architecture: arm64
    - name: Download mpv
      id: mpv
      uses: robinraju/release-downloader@v1
      with:
        repository: 'shinchiro/mpv-winbuild-cmake'
        latest: true
        fileName: 'mpv-dev-aarch64-*.7z'
    - name: Install dependencies
      run: |
        7z x "${{ fromJson(steps.mpv.outputs.downloaded_files)[0] }}"
        mv libmpv-2.dll mpv-2.dll
        pip install wheel
        pip install .[all] pywin32
        ./gen_pkg.sh --skip-build
      shell: bash
    - name: Check what libmpv needs
      # The pin on the download above exists because of a dependency this
      # step reads. It runs on every build rather than only when raising the
      # pin, because nothing else in the pipeline ever loads this file: an
      # mpv-2.dll that Windows will refuse is not a build error, it is a
      # client that dies at startup on the user's machine.
      run: |
        python tools/check_win_libmpv_deps.py mpv-2.dll
      shell: bash
    - name: Verify the inputs are ARM64
      # Before anything is built, because nothing downstream can tell. Windows
      # on Arm emulates x64, so an x64 interpreter here would build an x64
      # installer and upload it under the ARM64 name without one step failing.
      run: |
        python tools/check_win_arch.py mpv-2.dll
      shell: bash
    - name: PyInstaller Bootloader
      # Built from source for the same reason as the other jobs: the stock
      # wheel's prebuilt bootloader is on every antivirus heuristic list. The
      # two extra flags pin what the x86 jobs get for free -- waf would
      # otherwise infer the target from PROCESSOR_ARCHITECTURE and pick a C
      # compiler by search order, and either one guessing wrong produces an
      # x64 bootloader filed under the ARM64 name rather than an error.
      run: |
        ./gen_pkg.sh --get-pyinstaller
        cd pyinstaller/bootloader
        python ./waf --target-arch=64bit-arm --check-c-compiler=msvc distclean all
        cd ..
        pip install .
      shell: bash
    - name: Main Build
      run: |
        .\build-win-arm64.bat
      shell: cmd
    - name: Verify the output is ARM64
      # The bootloader is the one piece with its own architecture decision --
      # waf's, not the interpreter's -- so it is checked on the built result
      # rather than trusted from the flags that were passed in.
      run: |
        python tools/check_win_arch.py --skip-interpreter dist/run/run.exe
      shell: bash
    - name: Artifact Rename
      run: |
        ./artifacts.sh arm64
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-arm64
        path: ${{ github.workspace }}/publish/Installer/*.exe
  build-win32-legacy:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Setup git SDK
      uses: Shadowghost/setup-git-for-windows-sdk@node-24
      with:
        flavor: minimal
    - name: Download mpv
      id: mpv
      uses: robinraju/release-downloader@v1
      with:
        repository: 'shinchiro/mpv-winbuild-cmake'
        latest: true
        fileName: 'mpv-dev-i686*.7z'
    - name: Install dependencies
      run: |
        7z x "${{ fromJson(steps.mpv.outputs.downloaded_files)[0] }}"
        mv libmpv-2.dll mpv-2.dll
        pip install wheel
        pip install .[all] pywin32
        winget install --id JRSoftware.InnoSetup -e -s winget || true
        ./gen_pkg.sh --skip-build
      shell: bash
    - name: Check what libmpv needs
      # The pin on the download above exists because of a dependency this
      # step reads. It runs on every build rather than only when raising the
      # pin, because nothing else in the pipeline ever loads this file: an
      # mpv-2.dll that Windows will refuse is not a build error, it is a
      # client that dies at startup on the user's machine.
      run: |
        python tools/check_win_libmpv_deps.py mpv-2.dll
      shell: bash
    - name: PyInstaller Bootloader
      run: |
        ./gen_pkg.sh --get-pyinstaller; cd pyinstaller/bootloader; python ./waf distclean all; cd ..; pip install .
      shell: bash
    - name: Legacy Build
      run: |
        .\build-win-32.bat
      shell: cmd
    - name: Artifact Rename
      run: |
        ./artifacts.sh legacy
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-legacy32
        path: ${{ github.workspace }}/publish/InstallerLegacy/*.exe
  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Install Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder gettext
        # flatpak-builder needs unprivileged user namespaces, which Ubuntu
        # restricts through AppArmor. The runner images normally relax this
        # already, so don't fail the build if the knob isn't there.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
    - name: Fetch shared modules
      run: |
        git clone --depth=1 https://github.com/flathub/shared-modules.git flatpak/shared-modules
    - name: Cache flatpak-builder state
      uses: actions/cache@v6
      with:
        # mpv and its dependencies are built from source and dominate the run.
        # The key only moves when the manifest does, so the mpv build is
        # restored until it actually changes.
        path: ${{ github.workspace }}/.flatpak-builder
        key: flatpak-${{ matrix.arch }}-${{ hashFiles('flatpak/*.json') }}
        restore-keys: flatpak-${{ matrix.arch }}-
    - name: Install dependencies
      run: |
        ./gen_pkg.sh --skip-build
    - name: Main Build
      run: |
        flatpak-builder build flatpak/com.github.iwalton3.jellyfin-mpv-shim.json \
          --force-clean --repo=repo --user --install-deps-from=flathub
    - name: Artifact Rename
      run: |
        ./artifacts.sh flatpak ${{ matrix.arch }}
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: flatpak-${{ matrix.arch }}
        path: ${{ github.workspace }}/publish/Flatpak/*.flatpak
